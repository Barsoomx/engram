name: Compose E2E

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compose-e2e:
    name: Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Compose golden path
        run: python3 scripts/e2e_golden_path.py

      - name: Run Compose harness tests
        run: docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace:ro" -w /workspace engram-backend:local -ec 'mkdir -p /tmp/backend && cp /workspace/apps/backend/pyproject.toml /workspace/apps/backend/poetry.lock /tmp/backend/ && poetry -C /tmp/backend install --only dev --no-root --no-interaction && PYTHONPATH=/workspace python -m pytest -p no:cacheprovider /workspace/scripts/e2e_runtime_durability_tests.py /workspace/scripts/e2e_c43_atomic_memory_tests.py -q'

      - name: Run Compose claude-mem import
        run: python3 scripts/e2e_claude_mem_import.py

      - name: Run C4.3 atomic memory restart
        timeout-minutes: 30
        run: python3 scripts/e2e_c43_atomic_memory.py

      - name: Run Compose runtime durability
        timeout-minutes: 30
        run: python3 scripts/e2e_runtime_durability.py
