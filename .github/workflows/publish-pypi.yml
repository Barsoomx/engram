name: publish-pypi

# Trusted publishing (OIDC) for the engram-connect distribution (packages/cli).
# Matches the PyPI publisher configured for owner Barsoomx, repo engram, and this
# workflow filename. No API token is stored; PyPI verifies the OIDC identity of
# this workflow. Actions are SHA-pinned per repository policy.
#
# Publish deliberately: run this workflow manually, or push a tag like
# `engram-connect-v0.1.0`. Bump packages/cli/pyproject.toml `version` first;
# PyPI rejects re-uploading an existing version.

on:
  workflow_dispatch:
  push:
    tags:
      - 'engram-connect-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish engram-connect
    runs-on: ubuntu-latest
    # 'pypi' matches a trusted-publisher environment if one is configured, and is
    # ignored by PyPI when the publisher has no environment set. Add required
    # reviewers to this environment in repo Settings to gate publishes.
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build packages/cli --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
